url: http://localhost:3000
name: Landing playground is reachable
tags:
  - smoke
  - web
env:
  BASE_URL: http://localhost:3000
---
# The playground wrapper div is omitted from the AX tree (no accessible
# name), so CSS [data-testid='landing-playground'] never matches. Scroll to
# the section heading, which is a real text node.
- runFlow:
    file: ../subflows/open_origin.yaml
- scrollUntilVisible:
    element: "Try it."
    direction: DOWN
    timeout: 20000
- assertVisible: "Try it."
- assertVisible:
    id: how-it-works-heading
