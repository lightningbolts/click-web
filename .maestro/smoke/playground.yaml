url: http://localhost:3000
name: Landing playground is reachable
tags:
  - smoke
  - web
env:
  BASE_URL: http://localhost:3000
---
- runFlow:
    file: ../subflows/open_origin.yaml
- scrollUntilVisible:
    element:
      css: "[data-testid='landing-playground']"
    direction: DOWN
    timeout: 20000
- assertVisible:
    css: "[data-testid='landing-playground']"
