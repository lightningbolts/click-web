<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Circle and square logo">
  <!-- Soft mark background -->
  <rect width="128" height="128" rx="28" fill="#0F0A1A"/>

  <g transform="translate(128 0) scale(-1 1)">
    <!-- Square outline -->
    <rect
      x="24"
      y="48"
      width="52"
      height="52"
      rx="6"
      fill="none"
      stroke="#4C1D95"
      stroke-width="7"
    />

    <!-- Circle on top -->
    <circle
      cx="82"
      cy="46"
      r="28"
      fill="none"
      stroke="#C4B5FD"
      stroke-width="7"
    />
  </g>
</svg>
