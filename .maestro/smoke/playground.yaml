url: http://localhost:3000
name: Landing playground is reachable
tags:
  - smoke
  - web
env:
  BASE_URL: http://localhost:3000
---
# The playground wrapper div is omitted from the AX tree (no accessible
# name), so scroll to the stable section heading id instead of coupling this
# smoke test to marketing copy that may change during landing refinements.
- runFlow:
    file: ../subflows/open_origin.yaml
- scrollUntilVisible:
    element:
      id: how-it-works-heading
    direction: DOWN
    timeout: 30000
- assertVisible:
    id: how-it-works-heading
