url: http://localhost:3000
name: Legal and marketing pages
tags:
  - smoke
  - web
env:
  BASE_URL: http://localhost:3000
---
- runFlow:
    file: ../subflows/open_origin.yaml
- openLink: ${BASE_URL}/about
- assertVisible: "About"
- openLink: ${BASE_URL}/privacy
- assertVisible: "Privacy"
- openLink: ${BASE_URL}/terms
- assertVisible: "Terms of"
- openLink: ${BASE_URL}/enterprise
- assertVisible: "Student Affairs"
