url: http://localhost:3000
name: Authenticated dashboard chrome
tags:
  - auth
  - web
env:
  BASE_URL: http://localhost:3000
---
- runFlow:
    file: ../subflows/open_origin.yaml
- runFlow:
    file: ../subflows/login.yaml
- extendedWaitUntil:
    visible:
      css: "[data-testid='dashboard-root']"
    timeout: 30000
- assertVisible:
    css: "[data-testid='dashboard-chrome']"
- tapOn:
    css: "[data-testid='dashboard-tab-map']"
- tapOn:
    css: "[data-testid='dashboard-tab-chat']"
- tapOn:
    css: "[data-testid='dashboard-tab-settings']"
- tapOn:
    css: "[data-testid='dashboard-tab-memory']"
