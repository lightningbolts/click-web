url: http://localhost:3000
name: Legal and marketing pages
tags:
  - smoke
  - web
env:
  BASE_URL: http://localhost:3000
---
- runFlow:
    file: ../subflows/open_origin.yaml
- launchApp:
    appId: ${BASE_URL}/about
- extendedWaitUntil:
    visible: "About Click"
    timeout: 15000
- launchApp:
    appId: ${BASE_URL}/privacy
- extendedWaitUntil:
    visible: "Our Privacy Promise"
    timeout: 15000
- launchApp:
    appId: ${BASE_URL}/terms
- extendedWaitUntil:
    visible: "Terms of"
    timeout: 15000
- launchApp:
    appId: ${BASE_URL}/enterprise
- extendedWaitUntil:
    visible: "Student Affairs"
    timeout: 15000
