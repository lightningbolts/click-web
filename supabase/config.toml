# Local Supabase stack identifier only; production linkage is stored separately
# by `supabase link --project-ref <explicit-ref>`.
project_id = "click-web"

# Migrations in ./migrations are applied in timestamp order via `supabase db push`.

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[storage]
enabled = true

# The "Magic link" email is sent for device approval, Place team invites and sign-in; the template
# tells them apart by the link’s destination. Hosted projects: `scripts/apply-auth-email-templates.sh`,
# not `supabase config push` (this file’s site_url is local).
[auth.email.template.magic_link]
subject = "{{ if eq (printf \"%.*s\" (len \"https://joinclick.co/devices/approve/\") .RedirectTo) \"https://joinclick.co/devices/approve/\" }}New sign-in to Click: review this device{{ else if eq (printf \"%.*s\" (len \"https://joinclick.co/business/invite/\") .RedirectTo) \"https://joinclick.co/business/invite/\" }}Your invitation to join a Place on Click{{ else }}Your Click sign-in link{{ end }}"
content_path = "./supabase/templates/magic_link.html"
