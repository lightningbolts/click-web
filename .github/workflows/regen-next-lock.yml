name: Regenerate Next lockfile

on:
  push:
    branches:
      - fix/places-ci-post-merge

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/places-ci-post-merge
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Upgrade Next.js security patch and regenerate lockfile
        run: npm install next@16.3.8 eslint-config-next@16.3.8 --save-exact=false
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: upgrade Next.js to 16.3.8"
            git push origin HEAD:fix/places-ci-post-merge
          fi
