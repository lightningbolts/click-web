name: Fix MapLibre v6 imports

on:
  push:
    branches:
      - fix/event-chat-rsvp-access-20260913
    paths:
      - .github/workflows/fix-maplibre-v6.yml

permissions:
  contents: write

jobs:
  migrate-imports:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/event-chat-rsvp-access-20260913
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm

      - name: Migrate MapLibre imports
        shell: python
        run: |
          from pathlib import Path
          old = "import maplibregl from 'maplibre-gl';"
          new = "import * as maplibregl from 'maplibre-gl';"
          changed = []
          for suffix in ('*.ts', '*.tsx'):
              for path in Path('.').rglob(suffix):
                  if 'node_modules' in path.parts or '.next' in path.parts:
                      continue
                  text = path.read_text()
                  if old in text:
                      path.write_text(text.replace(old, new))
                      changed.append(str(path))
          print('\n'.join(changed))
          if not changed:
              raise SystemExit('No MapLibre default imports found')

      - name: Install dependencies
        run: npm ci

      - name: Verify typecheck
        run: npm run typecheck

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.ts' '*.tsx'
          git commit -m "fix: migrate MapLibre v6 imports"
          git push origin HEAD:fix/event-chat-rsvp-access-20260913
